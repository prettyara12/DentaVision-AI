name: Continuous Integration

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gate:
    name: Web Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Env is parsed lazily (src/lib/env.ts), so the build needs no secrets.
      - name: Build production bundle
        run: npm run build

  api-quality-gate:
    name: API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests (fake model)
        run: pytest -m "not smoke"

  model-smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    env:
      HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
      HF_MODEL_FILE: best_resnet50.pt
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Cache Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.HF_MODEL_REPO }}-best_resnet50
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Inference with real checkpoint
        run: pytest -m smoke

  database-quality-gate:
    name: Database pgTAP & RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase local containers
        run: supabase start
      - name: Run pgTAP test suites
        run: supabase test db
