name: Continuous Integration

on:
  pull_request:
    branches:
      - development
      - main
  push:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality-gate:
    name: Web Quality Gate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint & format check
        run: npm run lint
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Env is parsed lazily (src/lib/env.ts), so the build needs no secrets.
      - name: Build production bundle
        run: npm run build

  api-quality-gate:
    name: API Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests (fake model)
        run: pytest -m "not smoke"

  model-smoke-test:
    name: Model Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: api
    env:
      HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
      HF_MODEL_FILE: best_resnet50.pt
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - name: Cache Hugging Face checkpoint
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ vars.HF_MODEL_REPO }}-best_resnet50
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Inference with real checkpoint
        run: pytest -m smoke
      # Same image HF Spaces builds; the container downloads the checkpoint itself on start.
      - name: Build Space image
        run: docker build -t dentavision-api .
      - name: Analyze through the container
        run: |
          docker run -d --name api -p 7860:7860 -e API_SECRET=ci-container-secret dentavision-api
          # Up to 5 min for the checkpoint download + load; the server is not up for the first polls.
          for _ in $(seq 60); do
            status=$(curl -fs localhost:7860/health 2>/dev/null | python -c "import json,sys; print(json.load(sys.stdin)['status'])" 2>/dev/null || true)
            [ "$status" = ready ] && break
            if [ "$status" = error ]; then echo "::error::Model failed to load in the container (status=error)"; exit 1; fi
            sleep 5
          done
          if [ "$status" != ready ]; then echo "::error::Container not ready after 5 minutes (last status: ${status:-no response})"; exit 1; fi
          python -c "import sys; sys.path.insert(0, 'tests/smoke'); from test_checkpoint import teeth; from PIL import Image; Image.fromarray(teeth()).save('teeth.png')"
          curl -fsS -H "X-API-Secret: ci-container-secret" -F image=@teeth.png localhost:7860/v1/analyze -o result.json
          python -c "import json; r = json.load(open('result.json')); assert r['detections'] and r['heatmaps'], r; print(len(r['detections']), 'detections', sorted(r['heatmaps']), r['timing_ms'])"
      - name: Container logs
        if: failure()
        run: docker logs api || true

  database-quality-gate:
    name: Database pgTAP & RLS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Start Supabase local containers
        run: supabase start
      - name: Run pgTAP test suites
        run: supabase test db
